name: Deploy Cloudflare API and Web Workers

on:
  push:
    branches:
      - main
    paths:
      - app/api/**
      - app/web/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy_api:
    uses: ./.github/workflows/cf-worker-deploy.yaml
    with:
      worker: api
    secrets: inherit

  verify_api:
    needs: deploy_api
    runs-on: ubuntu-latest
    steps:
      - name: Verify API preflight
        run: |
          headers=$(curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors \
            --dump-header - --output /dev/null --request OPTIONS \
            --header 'Origin: https://recourt-v1.tuki.dev' \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: content-type' \
            https://api.recourt-v1.tuki.dev/api/chat)
          printf '%s\n' "$headers" | grep -qi '^access-control-allow-origin: https://recourt-v1.tuki.dev'

  deploy_web:
    needs: verify_api
    uses: ./.github/workflows/cf-worker-deploy.yaml
    with:
      worker: web
      build_web: true
    secrets: inherit
