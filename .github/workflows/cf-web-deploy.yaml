name: Deploy Cloudflare Web Worker

on:
  push:
    branches:
      - main
    paths:
      - app/web/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/cf-worker-deploy.yaml
    with:
      worker: web
      build_web: true
    secrets: inherit
