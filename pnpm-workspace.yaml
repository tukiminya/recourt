packages:
  - app/api
  - app/external-service
  - app/extract
  - app/internal
  - app/web
  - packages/lint
  - packages/database
  - packages/utils
  - packages/types
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: 4.1.9
  vite-plus: ^0.2.8
  wrangler: ^4.120.1
  hono: ^4.13.1
  ai: ^7.0.58
  "@ai-sdk/openai": ^4.0.36
  zod: ^4.4.3
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
